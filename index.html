<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramappa Hanagal - Senior Technical Lead Analyst</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --card-bg: #ffffff;
            --accent-gold: #d97706;
            --text-main: #1f2937;
            --border-line: #cbd5e1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.45;
            color: var(--text-main);
            max-width: 900px;
            margin: 0 auto;
            padding: 15px;
            background-color: var(--bg-body);
        }

        .resume-wrapper {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-top: 5px solid var(--accent-gold);
            width: 100%;
            overflow: hidden;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--border-line);
            padding-bottom: 15px;
            margin-bottom: 18px;
            position: relative;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-gold);
            background-color: #f3f4f6;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            min-width: 0; /* Prevents flex items from overflowing bounds */
        }

        .profile-info h1 {
            margin: 0 0 3px 0;
            color: #111827;
            font-size: 1.6em;
            letter-spacing: 0.5px;
            word-break: break-word;
        }

        .profile-info .job-role {
            margin: 0 0 8px 0;
            color: #4b5563;
            font-size: 0.95em;
            font-weight: 600;
        }

        .contact-box {
            font-size: 0.82em;
            color: #374151;
            background: #f9fafb;
            padding: 6px 10px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-gold);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .contact-box a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            word-break: break-all;
        }

        .print-btn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #1f2937;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 0.85em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .print-btn:hover {
            background-color: #374151;
        }

        /* Clickable Accordion Box */
        .accordion-item {
            margin-bottom: 10px;
            border-radius: 5px;
            background: #ffffff;
            border: 1px solid var(--border-line);
            overflow: hidden;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .accordion-header {
            font-size: 0.98em;
            font-weight: bold;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Removes mobile tap flash */
        }

        .accordion-header::after {
            content: '+';
            font-size: 1.2em;
            font-weight: bold;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .accordion-item.active .accordion-header::after {
            content: '-';
        }

        .accordion-item:nth-of-type(3) .accordion-header { background-color: #eff6ff; color: #1e40af; border-left: 4px solid #1e40af; }
        .accordion-item:nth-of-type(4) .accordion-header { background-color: #fdf4ff; color: #86198f; border-left: 4px solid #86198f; }
        .accordion-item:nth-of-type(5) .accordion-header { background-color: #fff7ed; color: #c2410c; border-left: 4px solid #c2410c; }
        .accordion-item:nth-of-type(6) .accordion-header { background-color: #fef2f2; color: #991b1b; border-left: 4px solid #991b1b; }
