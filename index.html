<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital CV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 15px;
        }

        .cv-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Responsive styling for tables and content */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media screen and (max-width: 768px) {
            body {
                padding: 5px;
            }
            .cv-container {
                max-width: 100%;
                width: 100%;
                padding: 15px;
                border-radius: 0;
                box-shadow: none;
            }
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            h1, h2, h3, p, span, li {
                word-wrap: break-word;
                overflow-wrap: break-word;
            }
        }
    </style>
</head>
<body>

    <div class="cv-container">
        <!-- Your original content goes here -->
        <h1>ನಿಮ್ಮ ಹೆಸರು</h1>
        <p>ಇಲ್ಲಿ ನಿಮ್ಮ CV ವಿವರಗಳನ್ನು ಸೇರಿಸಿ...</p>
    </div>

</body>
</html>
